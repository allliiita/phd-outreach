# Scope. Stage 0 (department discovery) fills data/departments.jsonl from this list;
# a verifier checks every department URL before rostering starts.
# csrankings: affiliation string in CSRankings when it differs from name.
# email_domains: official domains; subdomains are accepted automatically (cs.cmu.edu ⊂ cmu.edu).

target_departments: &depts
  - Computer Science / CS / EECS / School of Computer Science units (MLD, LTI, RI, HCII at CMU)
  - Statistics / Statistics & Data Science
  - Data Science institutes or departments that appoint faculty
  - Biostatistics (school of public health or medicine)
  - Bioinformatics / Computational Biology / Systems Biology
  - Biomedical Informatics / Biomedical Data Science
  - Electrical & Computer Engineering (ML, signal processing, robotics faculty only)
  - Applied Math / Computational & Applied Math
  - Operations Research / Industrial Engineering (ML/optimisation faculty only)
  - Computational neuroscience (Neuroscience, Brain & Cognitive Sciences: computational faculty only)

institutions:
  # ---- Universities (no Princeton, per applicant) ----
